<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="GitHub Trending — ilgi alanına göre seçilmiş projelerin Türkçe derin analizi ve jargon sözlüğü" />
    <title>daily — Günün Projeleri</title>
    <script>
      // FOUC önleme: tema tercihi render'dan önce uygulanır
      (function () {
        var t = localStorage.getItem('gp_theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
